<style>

*{box-sizing:border-box}body{margin:0;background:#101411;color:#f5f4ec;font:400 16px/1.6 Manrope,sans-serif}body.space{font-family:'Space Grotesk',sans-serif}button,input,textarea{font:inherit;border-radius:0}button{min-height:44px;padding:10px 18px;border:1px solid #fcd34d;background:#fcd34d;color:#174235;font-weight:600;cursor:default}button.secondary{background:transparent;color:#f5f4ec;border-color:#b9c6bd}button:disabled{background:#18221c;color:#b9c6bd;border-color:#35443c}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fcd34d;outline-offset:3px}h1,h2,p{margin:0}h1,h2{font-weight:600;color:#f5f4ec}h1{font-size:28px;line-height:1.2;letter-spacing:-.025em}h2{font-size:20px;line-height:1.3;letter-spacing:-.015em}p{max-width:65ch}small,.muted{color:#b9c6bd}.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.notice{padding:10px 20px;background:#174235;color:#f5f4ec;font-size:13px;text-align:center}.shell{width:calc(100% - 64px);max-width:1280px;margin:auto;border-inline:1px solid #35443c}header{min-height:76px;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #35443c}.brand{font-weight:700;font-size:24px;letter-spacing:-.04em}.brand span{color:#fcd34d}.content{padding:40px 32px}.stack{display:grid;gap:20px}.rule{border-top:1px solid #35443c;padding-top:24px}.actions{display:flex;gap:12px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:7fr 5fr}.hero-copy{padding:64px 40px;display:grid;align-content:center;gap:28px}.hero h1{font-size:clamp(44px,5.55vw,80px);line-height:1.02;letter-spacing:-.04em;text-wrap:balance;max-width:12ch}.lead{font-size:18px;line-height:1.55}.process{background:#174235;border-left:1px solid #35443c;padding:40px;display:grid;align-content:center;gap:0}.process div{padding:24px 0;border-bottom:1px solid #557266}.process div:last-child{border:0}.process strong{display:block;font-size:24px;line-height:1.25;font-weight:500}.process small{display:block;margin-top:8px;color:#f5f4ec}.band{border-top:1px solid #35443c;padding:28px 40px;display:grid;gap:10px}.workspace{max-width:1060px}.doc-head{display:flex;justify-content:space-between;align-items:start;gap:24px}.doc-head h1{max-width:36ch}.status{display:inline-block;padding:4px 10px;background:#174235;font-size:14px;white-space:nowrap}.thread{max-width:720px;margin-inline:auto;width:100%;display:grid;gap:20px}.message{padding:24px;background:#18221c;border-left:2px solid #35443c;display:grid;gap:8px}.message.author{background:#174235;margin-left:48px;border-left:0}.sender{font-size:14px;color:#b9c6bd}.composer{display:grid;gap:12px}.composer label{font-weight:500}textarea,input[type=text]{width:100%;background:#18221c;color:#f5f4ec;border:1px solid #b9c6bd;padding:12px;min-height:48px}textarea{resize:none;min-height:96px}.composer .actions{justify-content:space-between;align-items:center}.public{max-width:760px}.public .content{padding:36px 40px}.snapshot{background:#18221c;padding:24px;border-left:2px solid #b9c6bd;display:grid;gap:16px}.field{display:grid;gap:8px}.check{display:flex;align-items:start;gap:12px;min-height:44px}input[type=checkbox]{width:20px;height:20px;margin:3px 0;accent-color:#fcd34d;flex-shrink:0}.check span{flex:1}.form-hint{font-size:14px}.review-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<body>
<div class="notice">Estudio tipográfico · <span id="family"></span> + IBM Plex Mono · Datos ficticios · Sin acciones reales</div>
<div id="root"></div>
<script>
const params=new URLSearchParams(location.search);
const family=params.get('font')==='space'?'Space Grotesk':'Manrope';
document.body.classList.toggle('space',family==='Space Grotesk');
document.querySelector('#family').textContent=family;
const brand='<div class="brand">GALCOA<span>+</span></div>';
const header=(label)=>'<header>'+brand+'<span class="header-note muted">'+label+'</span></header>';
const operation='María Inés Álvarez acuerda con Nicolás Muñoz la entrega de 1.250 kg de maíz el 28 de octubre de 2026, por un total de $ 487.500,00. El lugar de entrega es el depósito de San José. El comprobante aportado no precisa el horario de recepción.';
const screens={
landing:`<div class="shell">${header('Documentación de operaciones')}<main><section class="hero"><div class="hero-copy"><h1>De la conversación al documento.</h1><p class="lead">Documentá operaciones por chat, revisá lo acordado y pedí la confirmación de los participantes.</p><div><button type="button">Crear documento</button></div></div><aside class="process" aria-label="Recorrido ilustrativo"><div><strong>Conversación</strong><small>Contá la operación con tus palabras.</small></div><div><strong>Revisión</strong><small>Revisá el documento y sus advertencias.</small></div><div><strong>Confirmaciones</strong><small>Todos responden sobre la misma revisión.</small></div></aside></section><section class="band"><h2>Una huella del documento, no una garantía de su contenido.</h2><p class="muted">El sello registra una huella en Hedera Testnet. No comprueba la verdad de la operación ni la identidad declarada.</p><p class="mono">Hedera Testnet</p></section></main></div>`,
chat:`<div class="shell workspace">${header('Documento · Chat')}<main class="content stack"><div class="doc-head"><div class="stack"><h1>Acuerdo de entrega de maíz en San José</h1><p class="mono muted">Referencia de muestra: OP-2026-1028</p></div><span class="status">Borrador</span></div><section class="thread rule" aria-label="Mensajes de muestra"><article class="message author"><p class="sender">Vos</p><p>Quiero documentar la entrega que acordamos. María Inés Álvarez y Nicolás Muñoz fijaron un total de $ 487.500,00 por 1.250 kg de maíz. La entrega será el miércoles 28 de octubre en San José.</p></article><article class="message"><p class="sender">Asistente · Mensaje de muestra</p><p>La operación incluye cantidad, importe y fecha de entrega. El comprobante no precisa el horario de recepción. Podés agregarlo o continuar con esa advertencia.</p></article><div class="composer rule"><label for="draft">Tu mensaje</label><textarea id="draft" readonly>El lugar de entrega es el depósito de San José.</textarea><div class="actions"><span class="muted">Sin envío en este estudio</span><button type="button">Enviar mensaje</button></div></div></section></main></div>`,
confirmation:`<div class="shell public">${header('Revisión pública')}<main class="content stack"><div class="stack"><h1>Revisión de una operación</h1><p class="muted">Leé la operación y confirmá o rechazá. No hace falta iniciar sesión.</p></div><section class="snapshot"><h2>Acuerdo de entrega de maíz en San José</h2><p>Vas a responder como: <strong>Comprador</strong></p><p class="muted">Participantes: autor y comprador.<br>Ejemplo sin enlace ni vencimiento real.</p><p data-reading>${operation}</p></section><form class="stack rule" onsubmit="return false"><h2>Tu respuesta</h2><div class="field"><label for="name">Nombre completo</label><input id="name" type="text" readonly value=""><p class="muted form-hint">Es un nombre que declarás vos; no se comprueba contra ningún documento.</p></div><label class="check"><input type="checkbox" disabled><span>Leí la operación y coincide con lo que conozco.</span></label><p class="muted form-hint">Escribí tu nombre completo para poder confirmar o rechazar. El rechazo requiere ratificación.</p><div class="review-actions"><button disabled>Confirmar</button><button class="secondary" disabled>No coincide / Rechazar</button></div></form></main></div>`
};
document.querySelector('#root').innerHTML=screens[params.get('screen')]||screens.landing;
</script>
